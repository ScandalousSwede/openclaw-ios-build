name: Setup pinned XcodeGen
description: Install and verify the exact XcodeGen release used by AIES iOS builds

runs:
  using: composite
  steps:
    - name: Install XcodeGen 2.46.0
      shell: bash
      env:
        XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        XCODEGEN_VERSION: 2.46.0
      run: |
        set -euo pipefail
        archive_path="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}.zip"
        extract_directory="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}-archive"
        prefix_directory="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
        curl \
          --proto '=https' \
          --tlsv1.2 \
          --fail \
          --location \
          --silent \
          --show-error \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
          --output "${archive_path}"
        printf '%s  %s\n' "${XCODEGEN_SHA256}" "${archive_path}" | shasum -a 256 -c -
        mkdir -p "${extract_directory}" "${prefix_directory}"
        ditto -x -k "${archive_path}" "${extract_directory}"
        bash "${extract_directory}/xcodegen/install.sh" "${prefix_directory}"
        chmod 0755 "${prefix_directory}/bin/xcodegen"
        version_output="$("${prefix_directory}/bin/xcodegen" --version)"
        if [[ "${version_output}" != "Version: ${XCODEGEN_VERSION}" ]]; then
          echo "Unexpected XcodeGen version output: ${version_output}" >&2
          exit 1
        fi
        printf 'Using %s\n' "${version_output}"
        echo "${prefix_directory}/bin" >> "${GITHUB_PATH}"
