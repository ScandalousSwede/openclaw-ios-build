          ):
              raise SystemExit("WebRTC signature-aware replay failed")
          support = binding.get("watchkit_support", {})
          if (
              support.get("archive", {}).get("raw_sha256")
              != "5d3149a79cbdb2d2b785869e3079bba91499813fbe5ed110b317d60212857db0"
              or support.get("ipa", {}).get("raw_sha256")
              != "5d3149a79cbdb2d2b785869e3079bba91499813fbe5ed110b317d60212857db0"
              or support.get("archive_to_ipa_payload_equivalence", {}).get("status")
              != "signature_aware_payload_equivalent"
          ):
              raise SystemExit("WatchKitSupport2 replay failed")
          summary = {
              "schema": "aies.stage-aware-post-export-manifest-replay.v1",
              "status": "passed",
              "iterations": 10,
              "stage_a_passes": 10,
              "stage_b_passes": 10,
              "post_export_manifest_passes": 10,
              "bundle_count_per_stage": 5,
              "application_mach_o_count": 7,
              "ipa_global_mach_o_count": 8,
              "archive_global_mach_o_count": 12,
              "auxiliary_code_object_count": 1,
              "stage_report_sha256": {
                  key: values[0] for key, values in sorted(stage_hashes.items())
              },
              "watch_extension_canonical_payload_sha256": equivalence[
                  "canonical_payload_sha256"
              ],
              "webrtc_canonical_payload_sha256": webrtc_equivalence[
                  "canonical_payload_sha256"
              ],
              "watchkit_support_sha256": support["ipa"]["raw_sha256"],
              "upload_performed": False,
              "apple_credentials_used": False,
          }
          pathlib.Path(sys.argv[2]).write_text(
