          import hashlib
          import json
          import pathlib
          import sys

          reports = pathlib.Path(sys.argv[1])
          expected_ids = {
              "ai.openclaw.client.J76B47MZ6V",
              "ai.openclaw.client.J76B47MZ6V.share",
              "ai.openclaw.client.J76B47MZ6V.activitywidget",
              "ai.openclaw.client.J76B47MZ6V.watchkitapp",
              "ai.openclaw.client.J76B47MZ6V.watchkitapp.extension",
          }
          stage_hashes = {"stage-a": [], "stage-b": [], "manifest": []}
          for iteration in range(1, 11):
              directory = reports / f"iteration-{iteration:02d}"
              for stage, status, section in (
                  ("stage-a", "archive_integrity_verified", "archive"),
                  (
                      "OpenClaw-signing-entitlements",
                      "exported_ipa_distribution_verified",
                      "ipa",
                  ),
              ):
                  path = directory / f"{stage}.json"
                  raw = path.read_bytes()
                  payload = json.loads(raw)
                  if payload.get("status") != status:
                      raise SystemExit(f"{path}: status mismatch")
                  bundles = payload.get(section, {}).get("bundles", [])
                  if {item.get("bundle_id") for item in bundles} != expected_ids:
                      raise SystemExit(f"{path}: incomplete five-target receipt")
                  auxiliary = payload.get(section, {}).get(
                      "auxiliary_code_objects", []
                  )
                  if (
                      len(auxiliary) != 1
                      or auxiliary[0].get("bundle_id") != "org.webrtc.WebRTC"
                      or auxiliary[0].get("profile") is not None
                  ):
                      raise SystemExit(f"{path}: incomplete WebRTC receipt")
                  app_topology = payload.get(section, {}).get(
                      "code_object_topology", {}
                  )
                  if (
                      app_topology.get("expected_mach_o_count") != 7
                      or app_topology.get("discovered_mach_o_count") != 7
                  ):
                      raise SystemExit(f"{path}: app code topology differs")
                  if stage == "stage-a":
                      if any(
                          item.get("get_task_allow") is not True
                          or item.get("profile", {}).get("profile_type") != "development"
                          for item in bundles
                      ):
                          raise SystemExit(f"{path}: archive signing observation differs")
                  else:
                      for item in bundles:
                          main = item.get("bundle_id") == "ai.openclaw.client.J76B47MZ6V"
                          profile = item.get("profile", {})
                          identity = item.get("signing_identity", {})
                          expected_aps = "production" if main else None
                          if (
                              item.get("get_task_allow") is not False
                              or profile.get("get_task_allow") is not False
                              or item.get("aps_environment") != expected_aps
                              or profile.get("aps_environment") != expected_aps
                              or profile.get("profile_type") != "app-store-connect"
                              or profile.get("provisioned_device_count") != 0
                              or profile.get("provisions_all_devices") is not False
                              or not str(identity.get("leaf_common_name", "")).startswith(
                                  "Apple Distribution:"
                              )
                          ):
                              raise SystemExit(f"{path}: distribution receipt differs")
                      auxiliary_identity = auxiliary[0].get("signing_identity", {})
                      if (
                          auxiliary_identity.get("team_identifier") != "J76B47MZ6V"
                          or auxiliary_identity.get("code_identifier") != "org.webrtc.WebRTC"
                          or not str(
                              auxiliary_identity.get("leaf_common_name", "")
                          ).startswith("Apple Distribution:")
                          or auxiliary[0].get("entitlements") != {}
                      ):
                          raise SystemExit(f"{path}: WebRTC distribution receipt differs")
                      global_topology = payload.get(section, {}).get(
                          "global_code_object_topology", {}
                      )
                      if (
                          global_topology.get("expected_mach_o_count") != 8
                          or global_topology.get("discovered_mach_o_count") != 8
                      ):
                          raise SystemExit(f"{path}: global IPA topology differs")
                  stage_key = "stage-a" if stage == "stage-a" else "stage-b"
                  stage_hashes[stage_key].append(hashlib.sha256(raw).hexdigest())
              manifest_path = directory / "OpenClaw-build-manifest.json"
              manifest_raw = manifest_path.read_bytes()
              manifest = json.loads(manifest_raw)
              readiness = {
                  "status": "VERIFIED_POST_EXPORT",
                  "final_distribution_verified": True,
                  "upload_eligible": True,
              }
              verification = manifest.get("final_distribution_verification", {})
              receipt_path = directory / "OpenClaw-signing-entitlements.json"
              stage_b = json.loads(receipt_path.read_text(encoding="utf-8"))
              archive_main = next(
                  item
                  for item in stage_b["archive"]["bundles"]
                  if item["bundle_id"] == "ai.openclaw.client.J76B47MZ6V"
              )
              ipa_artifacts = [
                  item
                  for item in manifest.get("artifacts", [])
                  if isinstance(item, dict) and item.get("kind") == "ipa"
              ]
              expected_ipa_sha256 = (
                  "6ab71eb0f64158726ce83af72de344f337447179538d82ec91e804eff431aa82"
              )
              if (
                  manifest.get("artifact_stage") != "EXPORTED_IPA_POST_EXPORT"
                  or manifest.get("distribution_readiness") != readiness
                  or manifest.get("embedded_distribution_expectations", {}).get(
                      "main_app_aps_environment"
                  ) != "production"
                  or manifest.get("observed_archive_signing", {}).get(
                      "main_app_aps_environment"
                  ) != "development"
                  or manifest.get("observed_archive_signing", {}).get(
                      "main_app_aps_environment"
                  ) != archive_main.get("aps_environment")
                  or verification.get("status")
                  != "exported_ipa_distribution_verified"
                  or verification.get("receipt_file_name") != receipt_path.name
                  or verification.get("receipt_sha256")
                  != hashlib.sha256(receipt_path.read_bytes()).hexdigest()
                  or verification.get("verifier_replayed_against_current_artifacts")
                  is not True
                  or verification.get("ipa_sha256") != expected_ipa_sha256
                  or len(ipa_artifacts) != 1
                  or ipa_artifacts[0].get("sha256") != expected_ipa_sha256
              ):
                  raise SystemExit(f"{manifest_path}: post-export manifest differs")
              stage_hashes["manifest"].append(hashlib.sha256(manifest_raw).hexdigest())
          if any(len(set(values)) != 1 for values in stage_hashes.values()):
              raise SystemExit(f"replay reports are nondeterministic: {stage_hashes!r}")
          final = json.loads(
              (
                  reports
                  / "iteration-01"
                  / "OpenClaw-signing-entitlements.json"
              ).read_text()
          )
          watch = next(
              item for item in final["binary_binding"]["bundles"]
              if item["bundle_id"].endswith("watchkitapp.extension")
          )
          equivalence = watch["archive_to_ipa_payload_equivalence"]
          if equivalence.get("status") != "signature_aware_payload_equivalent":
              raise SystemExit("Watch extension signature-aware replay failed")
          if equivalence.get("architecture_count") != 2:
              raise SystemExit("Watch extension architecture count differs")
          if any(
              len(item.get("normalized_fields", [])) != 3
              for item in equivalence.get("architectures", [])
          ):
              raise SystemExit("Watch extension normalized-field receipt differs")
          binding = final["binary_binding"]
          archive_topology = binding.get("archive_global_code_object_topology", {})
          if (
