name: Build iOS IPA (Debug/Personal Team)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/checkout@v4

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"

      - name: Install iOS build tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Install dependencies
        run: pnpm install

      - name: Detect signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_CERTIFICATE_P12_BASE64}" && -n "${APPLE_CERTIFICATE_PASSWORD}" && -n "${APPLE_PROVISIONING_PROFILE_BASE64}" ]]; then
            echo "SIGNING_SECRETS_AVAILABLE=true" >> "${GITHUB_ENV}"
            echo "Signing secrets detected; this run will attempt a signed archive."
          else
            echo "SIGNING_SECRETS_AVAILABLE=false" >> "${GITHUB_ENV}"
            echo "Signing secrets are incomplete or absent; falling back to unsigned IPA build."
          fi

      - name: Import signing assets
        if: env.SIGNING_SECRETS_AVAILABLE == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Import cert to keychain
          echo "${APPLE_CERTIFICATE_P12_BASE64}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain

          # Import provisioning profile
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          echo "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${HOME}/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          security cms -D -i "${HOME}/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" > /tmp/profile.plist

          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' /tmp/profile.plist)"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' /tmp/profile.plist)"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' /tmp/profile.plist)"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' /tmp/profile.plist 2>/dev/null || echo false)"

          cp "${HOME}/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          if [[ "${get_task_allow}" == "true" ]]; then
            code_sign_identity="Apple Development"
          else
            code_sign_identity="Apple Distribution"
          fi

          {
            echo "IOS_DEVELOPMENT_TEAM=${team_id}"
            echo "OPENCLAW_IOS_CODE_SIGN_STYLE=Manual"
            echo "OPENCLAW_IOS_APP_PROFILE=${profile_name}"
            echo "OPENCLAW_IOS_SHARE_PROFILE=${profile_name}"
            echo "OPENCLAW_IOS_WATCH_APP_PROFILE=${profile_name}"
            echo "OPENCLAW_IOS_WATCH_EXTENSION_PROFILE=${profile_name}"
            echo "OPENCLAW_IOS_CODE_SIGN_IDENTITY=${code_sign_identity}"
          } >> "${GITHUB_ENV}"

          echo "Imported provisioning profile '${profile_name}' (${profile_uuid}) for team ${team_id}."

      - name: Configure signing if available
        run: ./scripts/ios-configure-signing.sh || true

      - name: Generate Xcode project
        run: cd apps/ios && xcodegen generate

      - name: Build IPA (unsigned/development)
        run: |
          set -euo pipefail
          cd apps/ios

          if [[ "${SIGNING_SECRETS_AVAILABLE}" == "true" ]]; then
            xcodebuild \
              -project OpenClaw.xcodeproj \
              -scheme OpenClaw \
              -configuration Debug \
              -destination generic/platform=iOS \
              -archivePath /tmp/OpenClaw.xcarchive \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${IOS_DEVELOPMENT_TEAM}" \
              CODE_SIGN_IDENTITY="${OPENCLAW_IOS_CODE_SIGN_IDENTITY}" \
              PROVISIONING_PROFILE_SPECIFIER="${OPENCLAW_IOS_APP_PROFILE}"
          else
            xcodebuild \
              -project OpenClaw.xcodeproj \
              -scheme OpenClaw \
              -configuration Debug \
              -destination generic/platform=iOS \
              -archivePath /tmp/OpenClaw.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              || true
          fi

          mkdir -p /tmp/Payload
          if [ -d /tmp/OpenClaw.xcarchive/Products/Applications/OpenClaw.app ]; then
            cp -R /tmp/OpenClaw.xcarchive/Products/Applications/OpenClaw.app /tmp/Payload/
          elif [ -d build/Debug-iphoneos/OpenClaw.app ]; then
            cp -R build/Debug-iphoneos/OpenClaw.app /tmp/Payload/
          else
            echo "OpenClaw.app was not produced by xcodebuild." >&2
            exit 1
          fi

          cd /tmp
          zip -r OpenClaw.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-iOS-IPA
          path: /tmp/OpenClaw.ipa
          retention-days: 7
