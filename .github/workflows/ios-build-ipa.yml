name: Build iOS IPA (Unsigned / Protected Internal TestFlight)

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Build lane (signed upload is internal TestFlight only)
        required: true
        default: unsigned-diagnostic
        type: choice
        options:
          - unsigned-diagnostic
          - signed-internal-testflight
      expected_git_sha:
        description: Exact 40-character SHA required for signed internal TestFlight
        required: false
        type: string
      confirm_internal_only:
        description: Confirm no external testers or public App Store submission
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

# Workflow-only Release qualification executor. The workflow commit is not the
# candidate: every credential-free checkout and provenance field below is bound
# to this immutable source candidate instead.
env:
  AIES_RELEASE_EXECUTOR_BRANCH: aies/ios-build104-release-qualification-executor-v2-20260831
  AIES_RELEASE_SOURCE_BRANCH: aies/ios-build104-chat-history-apns-20260831
  AIES_RELEASE_SOURCE_SHA: 4e03d7109862f5b51407714794a520931fe2bd7c
  AIES_RELEASE_SOURCE_TREE: 711f50a29a732ab42812244148869cd63a900b71

jobs:
  dispatch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested lane
        env:
          AIES_CONFIRM_INTERNAL_ONLY: ${{ inputs.confirm_internal_only }}
          AIES_DISTRIBUTION: ${{ inputs.distribution }}
          AIES_EXPECTED_SHA: ${{ inputs.expected_git_sha }}
          AIES_GITHUB_ACTOR: ${{ github.actor }}
          AIES_GITHUB_SHA: ${{ github.sha }}
          AIES_GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AIES_REF_NAME: ${{ github.ref_name }}
          AIES_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${AIES_DISTRIBUTION}" == "unsigned-diagnostic" ]]; then
            if [[ "${AIES_EXPECTED_SHA}" != "${AIES_RELEASE_SOURCE_SHA}" ]]; then
              echo "Release qualification requires the exact accepted source SHA." >&2
              exit 1
            fi
            if [[ "${AIES_REF_TYPE}" != "branch" || "${AIES_REF_NAME}" != "${AIES_RELEASE_EXECUTOR_BRANCH}" ]]; then
              echo "Release qualification is restricted to the workflow-only executor branch." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "${AIES_DISTRIBUTION}" != "signed-internal-testflight" ]]; then
            echo "Unsupported distribution lane." >&2
            exit 1
          fi
          if [[ "${AIES_CONFIRM_INTERNAL_ONLY}" != "true" ]]; then
            echo "Signed dispatch requires explicit internal-only confirmation." >&2
            exit 1
          fi
          if [[ "${AIES_GITHUB_ACTOR}" != "ScandalousSwede" ]]; then
            echo "Signed AIES TestFlight dispatch is restricted to Ethan's GitHub account." >&2
            exit 1
          fi
          if [[ "${AIES_GITHUB_TRIGGERING_ACTOR}" != "ScandalousSwede" ]]; then
            echo "Signed AIES TestFlight reruns are restricted to Ethan's GitHub account." >&2
            exit 1
          fi
          if [[ ! "${AIES_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signed dispatch requires an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "${AIES_EXPECTED_SHA}" != "${AIES_GITHUB_SHA}" ]]; then
            echo "Requested SHA does not match the workflow checkout SHA." >&2
            exit 1
          fi
          if [[ "${AIES_REF_TYPE}" != "branch" ]]; then
            echo "Signed AIES TestFlight dispatch must originate from a branch ref." >&2
            exit 1
          fi
          if [[ "${AIES_REF_NAME}" != "aies/ios-rc1-testflight" ]]; then
            echo "Signed AIES TestFlight dispatch is restricted to the integrated RC1 branch." >&2
            exit 1
          fi

  xcodegen-conformance:
    needs: dispatch-gate
    runs-on: macos-15
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.2"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AIES_RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact Release qualification source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AIES_RELEASE_SOURCE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${AIES_RELEASE_SOURCE_TREE}"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git merge-base --is-ancestor "${AIES_RELEASE_SOURCE_SHA}" "${GITHUB_SHA}"
          executor_paths="$(git diff --name-only "${AIES_RELEASE_SOURCE_SHA}" "${GITHUB_SHA}")"
          test "${executor_paths}" = ".github/workflows/ios-build-ipa.yml"
          remote_candidate="$(git ls-remote origin "refs/heads/${AIES_RELEASE_SOURCE_BRANCH}" | awk '{print $1}')"
          test "${remote_candidate}" = "${AIES_RELEASE_SOURCE_SHA}"
          printf 'workflow_executor=%s\nsource_sha=%s\nsource_tree=%s\n' \
            "${GITHUB_SHA}" "${AIES_RELEASE_SOURCE_SHA}" "${AIES_RELEASE_SOURCE_TREE}"

      - name: Validate build-104 history shape against exact pinned gateway source
        run: |
          set -euo pipefail
          validation_root="${RUNNER_TEMP}/aies-chat-history-validator"
          upstream_root="${validation_root}/upstream"
          runtime_root="${validation_root}/runtime"
          pinned_sha="0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c"
          mkdir -p "${upstream_root}" "${runtime_root}/schema"
          git -C "${upstream_root}" init --quiet
          git -C "${upstream_root}" remote add origin https://github.com/openclaw/openclaw.git
          git -C "${upstream_root}" -c protocol.version=2 fetch --quiet --depth=1 origin "${pinned_sha}"
          test "$(git -C "${upstream_root}" rev-parse FETCH_HEAD)" = "${pinned_sha}"
          test "$(git -C "${upstream_root}" show -s --format=%T FETCH_HEAD)" = \
            "f855f357444931631be29141026876741ebc7dbd"
          test "$(git -C "${upstream_root}" rev-parse FETCH_HEAD:packages/gateway-protocol/src/schema/logs-chat.ts)" = \
            "eb3b7afae22eedfc1b6cda32be969208b7790670"
          test "$(git -C "${upstream_root}" rev-parse FETCH_HEAD:packages/gateway-protocol/src/index.ts)" = \
            "759bbaf1c39d7757350c001838852ebef87c4d51"
          test "$(git -C "${upstream_root}" rev-parse FETCH_HEAD:src/gateway/server-methods/chat.ts)" = \
            "22d6c3eb47c1caeb294b1b455bf687cb6715f732"
          for source_path in \
            packages/gateway-protocol/src/client-info.ts \
            packages/gateway-protocol/src/secret-ref-contract.ts \
            packages/gateway-protocol/src/schema/primitives.ts \
            packages/gateway-protocol/src/schema/logs-chat.ts
          do
            relative_path="${source_path#packages/gateway-protocol/src/}"
            mkdir -p "${runtime_root}/$(dirname "${relative_path}")"
            git -C "${upstream_root}" show "FETCH_HEAD:${source_path}" > \
              "${runtime_root}/${relative_path}"
          done
          cat > "${runtime_root}/package.json" <<'JSON'
          {"private":true,"type":"module","dependencies":{"typebox":"1.3.3","tsx":"4.22.4"}}
          JSON
          cat > "${runtime_root}/validate.mts" <<'TS'
          import { Compile } from "typebox/compile";
          import { ChatHistoryParamsSchema } from "./schema/logs-chat.ts";

          const payload = {
            sessionKey: "fixture-session",
            limit: 200,
            offset: 0,
            maxChars: 500000,
          };
          const validator = Compile(ChatHistoryParamsSchema);
          if (!validator.Check(payload)) {
            throw new Error(`pinned validator rejected reconstructed payload: ${JSON.stringify([...validator.Errors(payload)])}`);
          }
          const invalidPayload = { ...payload, offset: "0" };
          if (validator.Check(invalidPayload)) {
            throw new Error("pinned validator accepted a non-integer offset");
          }
          process.stdout.write(JSON.stringify({
            validator: "chat-history-0790d9f593ad",
            protocol: 4,
            payload: { limit: 200, offset: 0, maxChars: 500000 },
            accepted: true,
            nonIntegerOffsetAccepted: false,
          }) + "\n");
          TS
          npm --prefix "${runtime_root}" install --ignore-scripts --no-audit --no-fund
          "${runtime_root}/node_modules/.bin/tsx" "${runtime_root}/validate.mts"

      - name: Verify immutable ElevenLabsKit observability patch
        run: |
          set -euo pipefail
          original_revision="0f1e4c039bd0e22b03c0cb7f43c00c1865858f0b"
          original_tree="3a8eeeb4938a2ec30c46f3a90762187b2ca40fa6"
          patch_revision="0d166e7c2f41614ee5d98fd89d03314dace7848f"
          patch_tree="7b2f18911713ead34d640923d09f1f705143ccf0"
          dependency_root="${RUNNER_TEMP}/elevenlabskit-observability"
          evidence_root="${RUNNER_TEMP}/elevenlabskit-observability-evidence"
          mkdir -p "${evidence_root}"
          printf '%s\n' \
            "original_revision=${original_revision}" \
            "original_tree=${original_tree}" \
            "patch_revision=${patch_revision}" \
            "patch_tree=${patch_tree}" \
            > "${evidence_root}/authority.txt"
          git init --quiet "${dependency_root}"
          git -C "${dependency_root}" remote add origin \
            https://github.com/ScandalousSwede/ElevenLabsKit.git
          git -C "${dependency_root}" fetch --quiet --depth=2 origin "${patch_revision}"
          git -C "${dependency_root}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${dependency_root}" rev-parse HEAD)" == "${patch_revision}" ]]
          [[ "$(git -C "${dependency_root}" rev-parse 'HEAD^{tree}')" == "${patch_tree}" ]]
          [[ "$(git -C "${dependency_root}" show -s --format=%P HEAD)" == "${original_revision}" ]]
          [[ "$(git -C "${dependency_root}" rev-parse "${original_revision}^{tree}")" == "${original_tree}" ]]
          git -C "${dependency_root}" diff --exit-code "${original_revision}" -- Package.swift
          git -C "${dependency_root}" diff --binary \
            --output="${evidence_root}/elevenlabskit-observability.patch" \
            "${original_revision}" "${patch_revision}"
          python3 - "${dependency_root}" "${evidence_root}/source-checkout.json" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          expected = [
              "Sources/ElevenLabsKit/PCMStreamingAudioPlayer.swift",
              "Sources/ElevenLabsKit/PlaybackObservation.swift",
              "Sources/ElevenLabsKit/StreamingAudioPlayback.swift",
              "Sources/ElevenLabsKit/StreamingAudioPlayer.swift",
              "Tests/ElevenLabsKitTests/PlaybackObservationTests.swift",
              "Tests/ElevenLabsKitTests/StreamingAudioPlaybackTests.swift",
          ]
          observed = subprocess.run(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              cwd=root,
              capture_output=True,
              check=True,
              text=True,
          ).stdout.splitlines()
          if observed != expected:
              raise SystemExit(
                  "ElevenLabsKit patch paths differ: "
                  + json.dumps({"expected": expected, "observed": observed}, sort_keys=True)
              )
          report = {
              "schema": "aies.ios.package-source-patch-checkout.v1",
              "status": "verified",
              "original_revision": "0f1e4c039bd0e22b03c0cb7f43c00c1865858f0b",
              "original_tree": "3a8eeeb4938a2ec30c46f3a90762187b2ca40fa6",
              "patch_revision": "0d166e7c2f41614ee5d98fd89d03314dace7848f",
              "patch_tree": "7b2f18911713ead34d640923d09f1f705143ccf0",
              "changed_paths": observed,
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          set +e
          swift test --package-path "${dependency_root}" -c release 2>&1 | \
            tee "${evidence_root}/swift-test.log"
          swift_test_status="${PIPESTATUS[0]}"
          set -e
          [[ -z "$(git -C "${dependency_root}" status --porcelain=v2 --untracked-files=all)" ]]
          python3 - "${evidence_root}/test-result.json" "${swift_test_status}" <<'PY'
          import json
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          output.write_text(json.dumps({
              "schema": "aies.ios.package-source-patch-test.v1",
              "exit_status": status,
              "status": "passed" if status == 0 else "failed",
          }, indent=2, sort_keys=True) + "\n")
          PY
          (
            cd "${evidence_root}"
            shasum -a 256 \
              authority.txt \
              elevenlabskit-observability.patch \
              source-checkout.json \
              swift-test.log \
              test-result.json \
              > SHA256SUMS
            cat source-checkout.json
            cat test-result.json
            cat SHA256SUMS
          )
          exit "${swift_test_status}"

      - name: Retain ElevenLabsKit observability patch evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ElevenLabsKit-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elevenlabskit-observability-evidence
          retention-days: 90
          if-no-files-found: error

      - name: Install pinned credential-free release tooling
        run: |
          set -euo pipefail
          fastlane_gems="${RUNNER_TEMP}/aies-fastlane-2.228.0"
          gem install --no-document --install-dir "${fastlane_gems}" fastlane --version 2.228.0
          {
            echo "GEM_HOME=${fastlane_gems}"
            echo "GEM_PATH=${fastlane_gems}"
          } >> "${GITHUB_ENV}"
          echo "${fastlane_gems}/bin" >> "${GITHUB_PATH}"

      - name: Setup pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Generate Xcode project and verify tracked outputs
        run: |
          set -euo pipefail
          first_diff="${RUNNER_TEMP}/xcodegen-first.diff"
          second_diff="${RUNNER_TEMP}/xcodegen-second.diff"
          cd apps/ios
          xcodegen generate
          git -C ../.. diff --binary > "${first_diff}"
          first_untracked="$(git -C ../.. ls-files --others --exclude-standard)"
          xcodegen generate
          git -C ../.. diff --binary > "${second_diff}"
          second_untracked="$(git -C ../.. ls-files --others --exclude-standard)"
          if ! cmp -s "${first_diff}" "${second_diff}" || \
            [[ "${first_untracked}" != "${second_untracked}" ]]; then
            echo "Repeated XcodeGen 2.46.0 generation was nondeterministic." >&2
            diff -u "${first_diff}" "${second_diff}" || true
            exit 1
          fi
          echo "Second XcodeGen invocation produced no additional tracked or untracked changes."
          if ! git -C ../.. diff --exit-code; then
            echo "XcodeGen changed tracked outputs; commit deterministic generated changes first." >&2
            exit 1
          fi
          if [[ -n "${second_untracked}" ]]; then
            echo "XcodeGen left untracked outputs:" >&2
            printf '%s\n' "${second_untracked}" >&2
            exit 1
          fi

      - name: Test package authority and preparation tooling
        working-directory: apps/ios/Tools
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            test_aies_package_authority.py \
            test_aies_qualification_workflow_contract.py \
            test_credential_free_keychain_contract.py \
            test_prepare_aies_package_build_root.py \
            test_run_aies_qualification.py \
            test_run_aies_swift_qualification.py \
            test_verify_aies_unsigned_archive.py

      - name: Verify pinned Fastlane version
        run: |
          set -euo pipefail
          fastlane --version | tee "${RUNNER_TEMP}/fastlane-version.txt"
          grep -Eq 'fastlane 2\.228\.0([^0-9]|$)' "${RUNNER_TEMP}/fastlane-version.txt"

      - name: Verify rendered AIES export command
        working-directory: apps/ios
        run: fastlane ios verify_aies_export_command

  build:
    needs:
      - dispatch-gate
      - xcodegen-conformance
    if: inputs.distribution == 'unsigned-diagnostic'
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The fork's full 151-file lint list has pre-existing formatter debt. This
      # workflow is a compile/test/archive gate and must not mass-format it.
      OPENCLAW_SKIP_SOURCE_LINT: "YES"
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.2"

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AIES_RELEASE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact Release qualification source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AIES_RELEASE_SOURCE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${AIES_RELEASE_SOURCE_TREE}"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git merge-base --is-ancestor "${AIES_RELEASE_SOURCE_SHA}" "${GITHUB_SHA}"
          executor_paths="$(git diff --name-only "${AIES_RELEASE_SOURCE_SHA}" "${GITHUB_SHA}")"
          test "${executor_paths}" = ".github/workflows/ios-build-ipa.yml"
          remote_candidate="$(git ls-remote origin "refs/heads/${AIES_RELEASE_SOURCE_BRANCH}" | awk '{print $1}')"
          test "${remote_candidate}" = "${AIES_RELEASE_SOURCE_SHA}"
          printf 'workflow_executor=%s\nsource_sha=%s\nsource_tree=%s\n' \
            "${GITHUB_SHA}" "${AIES_RELEASE_SOURCE_SHA}" "${AIES_RELEASE_SOURCE_TREE}"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Install iOS build tools
        run: brew install swiftlint swiftformat

      - name: Setup pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Prepare strict aggregate package build root
        run: |
          set -euo pipefail
          package_runtime="${RUNNER_TEMP}/aies-unsigned-package"
          mkdir -p "${package_runtime}"
          python3 apps/ios/Tools/prepare_aies_package_build_root.py prepare \
            --source-root "${GITHUB_WORKSPACE}" \
            --build-root "${package_runtime}/build-root" \
            --allowed-root "${package_runtime}" \
            --expected-sha "${AIES_RELEASE_SOURCE_SHA}" \
            --evidence-dir "${package_runtime}/evidence" \
            --github-env "${GITHUB_ENV}"

      - name: Install dependencies in prepared build root
        run: |
          set -euo pipefail
          cd "${AIES_BUILD_ROOT}"
          pnpm install --frozen-lockfile
          [[ -z "$(git status --porcelain=v2 --untracked-files=all)" ]]

      - name: Prepare canonical unsigned AIES archive identity
        run: |
          set -euo pipefail
          build_number="${GITHUB_RUN_NUMBER}"
          cd "${AIES_BUILD_ROOT}"
          bash scripts/ios-beta-prepare.sh \
            --build-number "${build_number}" \
            --team-id J76B47MZ6V \
            --push-mode direct
          beta_xcconfig="${AIES_BUILD_ROOT}/apps/ios/build/BetaRelease.xcconfig"
          [[ -f "${beta_xcconfig}" && ! -L "${beta_xcconfig}" ]]
          grep -Fqx 'OPENCLAW_APP_BUNDLE_ID = ai.openclaw.client.J76B47MZ6V' "${beta_xcconfig}"
          grep -Fqx 'OPENCLAW_SHARE_BUNDLE_ID = ai.openclaw.client.J76B47MZ6V.share' "${beta_xcconfig}"
          grep -Fqx 'OPENCLAW_ACTIVITY_WIDGET_BUNDLE_ID = ai.openclaw.client.J76B47MZ6V.activitywidget' "${beta_xcconfig}"
          grep -Fqx 'OPENCLAW_WATCH_APP_BUNDLE_ID = ai.openclaw.client.J76B47MZ6V.watchkitapp' "${beta_xcconfig}"
          grep -Fqx 'OPENCLAW_WATCH_EXTENSION_BUNDLE_ID = ai.openclaw.client.J76B47MZ6V.watchkitapp.extension' "${beta_xcconfig}"
          beta_xcconfig_sha256="$(shasum -a 256 "${beta_xcconfig}" | awk '{print $1}')"
          python3 apps/ios/Tools/prepare_aies_package_build_root.py verify \
            --receipt "${AIES_PACKAGE_PREPARATION_RECEIPT}" \
            --output "${RUNNER_TEMP}/aies-unsigned-package/evidence/post-beta-prepare-verification.json"
          [[ -z "$(git status --porcelain=v2 --untracked-files=all)" ]]
          {
            echo "AIES_UNSIGNED_BUILD_NUMBER=${build_number}"
            echo "AIES_UNSIGNED_XCCONFIG=${beta_xcconfig}"
            echo "AIES_UNSIGNED_XCCONFIG_SHA256=${beta_xcconfig_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Capture build provenance
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          archive_uuid="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          git_branch="${AIES_RELEASE_SOURCE_BRANCH}"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          swift_version="$(swift --version | sed -n '1p')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          {
            echo "AIES_BUILD_TIMESTAMP=${build_timestamp}"
            echo "AIES_ARCHIVE_UUID=${archive_uuid}"
            echo "AIES_GIT_BRANCH=${git_branch}"
            echo "AIES_XCODE_VERSION=${xcode_version}"
            echo "AIES_SWIFT_VERSION=${swift_version}"
            echo "AIES_SDK_VERSION=${sdk_version}"
            echo "AIES_APS_ENVIRONMENT="
          } >> "${GITHUB_ENV}"

      # This workflow intentionally proves compile/archive attribution without signing.
      # App, share, widget, and Watch bundles require distinct provisioning profiles;
      # signed multi-bundle distribution remains a separate physical-test gate.
      - name: Declare unsigned archive boundary
        run: echo "Building an unsigned multi-bundle archive; no signing credentials are consumed."

      - name: Test build manifest and internal release-policy tooling
        run: |
          cd "${AIES_BUILD_ROOT}/apps/ios/Tools"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            test_aies_package_authority.py \
            test_aies_qualification_workflow_contract.py \
            test_credential_free_keychain_contract.py \
            test_prepare_aies_package_build_root.py \
            test_run_aies_qualification.py \
            test_run_aies_swift_qualification.py \
            test_sanitize_aies_release_log.py \
            test_verify_aies_unsigned_archive.py \
            test_embed_runtime_symbolication_manifest.py \
            test_write_build_manifest.py \
            test_aies_macho_signature_equivalence.py \
            test_aies_release_gate_behavior.py \
            test_verify_aies_internal_signing.py

      - name: Verify canonical unsigned AIES build settings
        run: |
          set -euo pipefail
          strict_package_args=()
          while IFS= read -r argument; do
            strict_package_args+=("${argument}")
          done < "${AIES_STRICT_PACKAGE_ARGS_FILE}"
          raw_settings="${RUNNER_TEMP}/aies-unsigned-package/evidence/unsigned-build-settings.json"
          report="${RUNNER_TEMP}/aies-unsigned-package/evidence/unsigned-bundle-topology.json"
          cd "${AIES_BUILD_ROOT}/apps/ios"
          XCODE_XCCONFIG_FILE="${AIES_UNSIGNED_XCCONFIG}" xcodebuild \
            -project OpenClaw.xcodeproj \
            -alltargets \
            -configuration Release \
            -showBuildSettings \
            -json \
            "${strict_package_args[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            > "${raw_settings}"
          PYTHONPATH="${AIES_BUILD_ROOT}/apps/ios/Tools" python3 - \
            "${raw_settings}" "${report}" <<'PY'
          import json
          import pathlib
          import sys

          from verify_aies_unsigned_archive import build_settings_topology_report

          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          report = build_settings_topology_report(
              json.loads(source.read_text(encoding="utf-8")),
              "ai.openclaw.client.J76B47MZ6V",
          )
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/prepare_aies_package_build_root.py" verify \
            --receipt "${AIES_PACKAGE_PREPARATION_RECEIPT}" \
            --output "${RUNNER_TEMP}/aies-unsigned-package/evidence/post-build-settings-verification.json"
          [[ -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v2 --untracked-files=all)" ]]

      - name: Build OpenClawKit and run S0-S3 reliability tests
        run: |
          set -euo pipefail
          shared_root="${RUNNER_TEMP}/aies-unsigned-shared-tests"
          git clone --quiet --no-hardlinks --no-checkout "${GITHUB_WORKSPACE}" "${shared_root}"
          git -C "${shared_root}" checkout --quiet --detach "${AIES_RELEASE_SOURCE_SHA}"
          shared_package="${shared_root}/apps/shared/OpenClawKit"
          swift package --package-path "${shared_package}" resolve
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/aies_package_authority.py" \
            --repo-root "${AIES_BUILD_ROOT}" \
            validate-scoped-resolved \
            --scope openclawkit \
            --resolved "${shared_package}/Package.resolved" \
            --output "${RUNNER_TEMP}/aies-unsigned-package/evidence/openclawkit-resolved.json"
          # Prove the unmodified production module builds under the Release
          # optimizer first. The existing reliability suites use helpers that
          # are intentionally compiled only under DEBUG, so enable that
          # condition solely for the Release-optimized test products.
          swift build -c release --package-path "${shared_package}" --force-resolved-versions
          release_test_args=(
            -c release
            --package-path "${shared_package}"
            --force-resolved-versions
            -Xswiftc -DDEBUG
          )
          swift test "${release_test_args[@]}" --filter OpenClawDiagnosticEventTests
          swift test "${release_test_args[@]}" --filter DeepLinksSecurityTests
          swift test "${release_test_args[@]}" --filter GatewayNodeSessionTests
          swift test "${release_test_args[@]}" --filter ChatViewModelTests
          swift test "${release_test_args[@]}" --filter OpenClawChatOutboxStorageTests
          swift test "${release_test_args[@]}" --filter OpenClawChatOutboxIntegrationTests
          [[ -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v2 --untracked-files=all)" ]]

      - name: Run iOS tests
        run: |
          set -euo pipefail
          simulator_udid="$({ xcrun simctl list devices available --json; } | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = []
          for runtime, entries in payload.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              devices.extend(
                  entry for entry in entries
                  if entry.get("isAvailable")
                  and entry.get("udid")
                  and str(entry.get("name", "")).startswith("iPhone")
              )
          if not devices:
              raise SystemExit("No available iOS simulator")
          print(devices[0]["udid"])
          ' )"
          strict_package_args=()
          while IFS= read -r argument; do
            strict_package_args+=("${argument}")
          done < "${AIES_STRICT_PACKAGE_ARGS_FILE}"
          cd "${AIES_BUILD_ROOT}/apps/ios"
          XCODE_XCCONFIG_FILE="${AIES_UNSIGNED_XCCONFIG}" xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${simulator_udid}" \
            -parallel-testing-enabled NO \
            -only-testing:OpenClawTests/AIESCrashDiagnosticExporterTests \
            -only-testing:OpenClawTests/AIESAPNsDiagnosticsTests \
            -only-testing:OpenClawTests/AIESDiagnosticRunContinuityTests \
            -only-testing:OpenClawTests/AppCoverageTests \
            -only-testing:OpenClawTests/DeepLinkParserTests \
            -only-testing:OpenClawTests/ExecApprovalNotificationBridgeTests \
            -only-testing:OpenClawTests/GatewayConnectionControllerTests \
            -only-testing:OpenClawTests/GatewayConnectionSecurityTests \
            -only-testing:OpenClawTests/GatewayMobileSetupStateTests \
            -only-testing:OpenClawTests/GatewaySetupDeliveryOwnershipTests \
            -only-testing:OpenClawTests/GatewayOperatorScopeTests \
            -only-testing:OpenClawTests/GatewayOnboardingResetTests \
            -only-testing:OpenClawTests/GatewayStatusBuilderTests \
            -only-testing:OpenClawTests/IOSGatewayChatTransportTests \
            -only-testing:OpenClawTests/LiveActivityManagerTests \
            -only-testing:OpenClawTests/NodeAppModelInvokeTests \
            -only-testing:OpenClawTests/OnboardingStateStoreTests \
            -only-testing:OpenClawTests/OpenClawAppDelegateTests \
            -only-testing:OpenClawTests/QRScannerResultHandoffTests \
            -only-testing:OpenClawTests/SwiftUIRenderSmokeTests \
            -only-testing:OpenClawTests/TalkModeManagerTests \
            -only-testing:OpenClawTests/TalkDurableOutboxTests \
            -only-testing:OpenClawTests/TalkModeIncrementalSpeechBufferTests \
            -only-testing:OpenClawTests/TalkProStateTests \
            -only-testing:OpenClawTests/TalkTTSDiagnosticsTests \
            -only-testing:OpenClawTests/WatchSessionActivationGateTests \
            "${strict_package_args[@]}" \
            test \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG AIES_CREDENTIAL_FREE_TEST_KEYCHAIN' \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Archive iOS app
        run: |
          set -euo pipefail
          strict_package_args=()
          while IFS= read -r argument; do
            strict_package_args+=("${argument}")
          done < "${AIES_STRICT_PACKAGE_ARGS_FILE}"
          cd "${AIES_BUILD_ROOT}/apps/ios"

          provenance_settings=(
            "OPENCLAW_BUILD_GIT_SHA=${AIES_RELEASE_SOURCE_SHA}"
            "OPENCLAW_BUILD_GIT_BRANCH=${AIES_GIT_BRANCH}"
            "OPENCLAW_BUILD_TIMESTAMP=${AIES_BUILD_TIMESTAMP}"
            "OPENCLAW_BUILD_XCODE_VERSION=${AIES_XCODE_VERSION}"
            "OPENCLAW_BUILD_SWIFT_VERSION=${AIES_SWIFT_VERSION}"
            "OPENCLAW_BUILD_SDK_VERSION=${AIES_SDK_VERSION}"
            "OPENCLAW_BUILD_CONFIGURATION=Release"
            "OPENCLAW_BUILD_ARCHIVE_UUID=${AIES_ARCHIVE_UUID}"
            "OPENCLAW_BUILD_APS_ENVIRONMENT_IF_SIGNED=${AIES_APS_ENVIRONMENT}"
          )

          XCODE_XCCONFIG_FILE="${AIES_UNSIGNED_XCCONFIG}" xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath /tmp/OpenClaw.xcarchive \
            "${strict_package_args[@]}" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            "${provenance_settings[@]}"

          app_path=/tmp/OpenClaw.xcarchive/Products/Applications/OpenClaw.app
          if [[ ! -d "${app_path}" ]]; then
            echo "OpenClaw.app was not produced by xcodebuild." >&2
            exit 1
          fi

          package_root="$(mktemp -d)"
          mkdir -p "${package_root}/Payload"
          ditto "${app_path}" "${package_root}/Payload/OpenClaw.app"
          (
            cd "${package_root}"
            zip -qry /tmp/OpenClaw.ipa Payload
          )

      - name: Package archive and symbols
        run: |
          set -euo pipefail
          if ! find /tmp/OpenClaw.xcarchive/dSYMs -maxdepth 1 -name '*.dSYM' -print -quit | grep -q .; then
            echo "OpenClaw archive contains no dSYMs." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/OpenClaw.xcarchive \
            /tmp/OpenClaw.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/OpenClaw.xcarchive/dSYMs \
            /tmp/OpenClaw-dSYMs.zip

      - name: Write build manifest
        run: |
          set -euo pipefail
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/write_build_manifest.py" \
            --archive /tmp/OpenClaw.xcarchive \
            --output /tmp/OpenClaw-build-manifest.json \
            --git-sha "${AIES_RELEASE_SOURCE_SHA}" \
            --git-branch "${AIES_GIT_BRANCH}" \
            --build-timestamp "${AIES_BUILD_TIMESTAMP}" \
            --xcode-version "${AIES_XCODE_VERSION}" \
            --swift-version "${AIES_SWIFT_VERSION}" \
            --sdk-version "${AIES_SDK_VERSION}" \
            --configuration Release \
            --archive-uuid "${AIES_ARCHIVE_UUID}" \
            --ipa /tmp/OpenClaw.ipa \
            --artifact-stage UNSIGNED_ARCHIVE_QUALIFICATION \
            --archive-zip /tmp/OpenClaw.xcarchive.zip \
            --dsym-zip /tmp/OpenClaw-dSYMs.zip \
            --github-run-id "${GITHUB_RUN_ID}"
          python3 - /tmp/OpenClaw-build-manifest.json <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "artifact_stage": "UNSIGNED_ARCHIVE_QUALIFICATION",
              "evidence_stage": "unsigned",
              "distribution_readiness": {
                  "status": "NOT_APPLICABLE_UNSIGNED",
                  "final_distribution_verified": False,
                  "upload_eligible": False,
              },
          }
          mismatches = {
              key: {"expected": value, "actual": manifest.get(key)}
              for key, value in expected.items()
              if manifest.get(key) != value
          }
          verification = manifest.get("final_distribution_verification")
          if (
              not isinstance(verification, dict)
              or verification.get("status")
              != "not_applicable_unsigned_qualification"
              or verification.get("receipt_sha256") is not None
              or verification.get("ipa_sha256") is not None
          ):
              mismatches["final_distribution_verification"] = verification
          archive_integrity = manifest.get("archive_integrity_verification")
          if archive_integrity != {
              "status": "not_applicable_unsigned_qualification",
              "receipt_file_name": None,
              "receipt_sha256": None,
              "verifier_replayed_against_current_artifacts": False,
          }:
              mismatches["archive_integrity_verification"] = archive_integrity
          if mismatches:
              raise SystemExit(
                  "unsigned manifest claimed a release distribution stage: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          PY

      - name: Verify unsigned five-bundle archive and seal provenance
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/openclaw-aies-unsigned-evidence"
          mkdir -p "${evidence_root}"
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/verify_aies_unsigned_archive.py" \
            --archive /tmp/OpenClaw.xcarchive \
            --ipa /tmp/OpenClaw.ipa \
            --archive-zip /tmp/OpenClaw.xcarchive.zip \
            --expected-main-bundle-id ai.openclaw.client.J76B47MZ6V \
            --output "${evidence_root}/OpenClaw-unsigned-archive.json"
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/prepare_aies_package_build_root.py" verify \
            --receipt "${AIES_PACKAGE_PREPARATION_RECEIPT}" \
            --output "${RUNNER_TEMP}/aies-unsigned-package/evidence/post-archive-verification.json"
          cp /tmp/OpenClaw-build-manifest.json "${evidence_root}/"
          ditto "${RUNNER_TEMP}/aies-unsigned-package/evidence" \
            "${evidence_root}/package-authority"
          python3 - "${evidence_root}" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          source_status = subprocess.run(
              ["git", "status", "--porcelain=v2", "--untracked-files=all"],
              capture_output=True,
              check=True,
              text=True,
          ).stdout
          if source_status:
              raise SystemExit("authoritative workflow checkout became dirty")
          records = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              if path.name == "SHA256SUMS":
                  continue
              records.append(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  "
                  f"{path.relative_to(root).as_posix()}"
              )
          (root / "SHA256SUMS").write_text("\n".join(records) + "\n")
          custody = {
              "schema": "aies.ios.unsigned-source-custody.v1",
              "gitSHA": subprocess.run(
                  ["git", "rev-parse", "HEAD"], capture_output=True, check=True, text=True
              ).stdout.strip(),
              "gitTree": subprocess.run(
                  ["git", "rev-parse", "HEAD^{tree}"], capture_output=True, check=True, text=True
              ).stdout.strip(),
              "statusPorcelainV2": source_status,
          }
          (root / "source-custody.json").write_text(
              json.dumps(custody, indent=2, sort_keys=True) + "\n"
          )
          PY
          (
            cd "${evidence_root}"
            shasum -a 256 source-custody.json >> SHA256SUMS
          )
          cat "${evidence_root}/OpenClaw-unsigned-archive.json"
          cat "${evidence_root}/package-authority/package-preparation.json"
          cat "${evidence_root}/SHA256SUMS"

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-iOS-IPA-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/OpenClaw.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload xcarchive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-iOS-xcarchive-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/OpenClaw.xcarchive.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-iOS-dSYMs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/OpenClaw-dSYMs.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-iOS-build-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/OpenClaw-build-manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload package authority and unsigned provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-iOS-package-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-aies-unsigned-evidence
          retention-days: 90
          if-no-files-found: error

  signed-internal-testflight:
    needs:
      - dispatch-gate
      - xcodegen-conformance
    if: >-
      inputs.distribution == 'signed-internal-testflight' &&
      github.ref_type == 'branch' &&
      github.actor == 'ScandalousSwede' &&
      github.triggering_actor == 'ScandalousSwede'
    runs-on: macos-15
    timeout-minutes: 120
    environment: aies-testflight-internal
    concurrency:
      group: aies-ios-internal-testflight
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENCLAW_SKIP_SOURCE_LINT: "YES"
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.2"

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_git_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact release checkout
        env:
          AIES_EXPECTED_SHA: ${{ inputs.expected_git_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${AIES_EXPECTED_SHA}" ]]; then
            echo "Signed release checkout does not match expected_git_sha." >&2
            exit 1
          fi

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Install iOS build tools
        run: |
          set -euo pipefail
          brew install swiftlint swiftformat
          fastlane_gems="${RUNNER_TEMP}/aies-fastlane-2.228.0"
          gem install --no-document --install-dir "${fastlane_gems}" fastlane --version 2.228.0
          {
            echo "GEM_HOME=${fastlane_gems}"
            echo "GEM_PATH=${fastlane_gems}"
          } >> "${GITHUB_ENV}"
          echo "${fastlane_gems}/bin" >> "${GITHUB_PATH}"

      - name: Setup pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Prepare strict aggregate package build root
        run: |
          set -euo pipefail
          package_runtime="${RUNNER_TEMP}/aies-signed-package"
          mkdir -p "${package_runtime}"
          python3 apps/ios/Tools/prepare_aies_package_build_root.py prepare \
            --source-root "${GITHUB_WORKSPACE}" \
            --build-root "${package_runtime}/build-root" \
            --allowed-root "${package_runtime}" \
            --expected-sha "${GITHUB_SHA}" \
            --evidence-dir "${package_runtime}/evidence" \
            --github-env "${GITHUB_ENV}"

      - name: Install dependencies in prepared build root
        run: |
          set -euo pipefail
          cd "${AIES_BUILD_ROOT}"
          pnpm install --frozen-lockfile
          [[ -z "$(git status --porcelain=v2 --untracked-files=all)" ]]

      - name: Verify protected environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="${RUNNER_TEMP}/aies-environment.json"
          branch_policies_json="${RUNNER_TEMP}/aies-environment-branches.json"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/environments/aies-testflight-internal" \
            > "${environment_json}"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/environments/aies-testflight-internal/deployment-branch-policies?per_page=100" \
            > "${branch_policies_json}"
          python3 - "${environment_json}" "${branch_policies_json}" <<'PY'
          import json
          import pathlib
          import sys

          environment = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          policies = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          reviewer_rules = [
              rule for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers"
          ]
          if reviewer_rules:
              raise SystemExit(
                  "AIES single-owner environment must not require a deployment reviewer"
              )
          deployment_policy = environment.get("deployment_branch_policy") or {}
          if deployment_policy.get("custom_branch_policies") is not True:
              raise SystemExit("AIES environment must use a custom branch policy")
          if deployment_policy.get("protected_branches") is not False:
              raise SystemExit("AIES environment must not admit all protected branches")
          policy_items = policies.get("branch_policies", [])
          policy_identity = {(item.get("name"), item.get("type")) for item in policy_items}
          if policy_identity != {("aies/ios-rc1-testflight", "branch")}:
              raise SystemExit(
                  "AIES environment must allow only the integrated RC1 branch as a branch policy"
              )
          PY
          rm -f -- "${environment_json}" "${branch_policies_json}"

      - name: Validate protected release metadata
        env:
          AIES_ENVIRONMENT_ENABLED: ${{ vars.AIES_TESTFLIGHT_INTERNAL_ENABLED }}
          AIES_INTERNAL_TESTER_GROUP_VALUE: ${{ vars.AIES_INTERNAL_TESTER_GROUP }}
          APP_BUNDLE_ID_VALUE: ${{ vars.APP_BUNDLE_ID }}
          APP_STORE_CONNECT_APP_ID_VALUE: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APPLE_TEAM_ID_VALUE: ${{ vars.APPLE_TEAM_ID }}
          ASC_ISSUER_ID_VALUE: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID_VALUE: ${{ vars.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          [[ "${AIES_ENVIRONMENT_ENABLED}" == "true" ]] || {
            echo "Protected environment is not explicitly enabled." >&2
            exit 1
          }
          [[ "${APP_BUNDLE_ID_VALUE}" == "ai.openclaw.client.J76B47MZ6V" ]] || {
            echo "APP_BUNDLE_ID does not match the isolated AIES app." >&2
            exit 1
          }
          [[ "${APPLE_TEAM_ID_VALUE}" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "APPLE_TEAM_ID is missing or malformed." >&2
            exit 1
          }
          [[ "${ASC_KEY_ID_VALUE}" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "ASC_KEY_ID is missing or malformed." >&2
            exit 1
          }
          [[ "${ASC_ISSUER_ID_VALUE}" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "ASC_ISSUER_ID is missing or malformed." >&2
            exit 1
          }
          [[ "${APP_STORE_CONNECT_APP_ID_VALUE}" =~ ^[0-9]+$ ]] || {
            echo "APP_STORE_CONNECT_APP_ID is missing or malformed." >&2
            exit 1
          }
          [[ "${AIES_INTERNAL_TESTER_GROUP_VALUE}" =~ ^[A-Za-z0-9][A-Za-z0-9._\ /()-]{0,79}$ ]] || {
            echo "AIES_INTERNAL_TESTER_GROUP is missing or contains unsafe characters." >&2
            exit 1
          }

      - name: Capture signed-build provenance
        env:
          AIES_INTERNAL_TESTER_GROUP_VALUE: ${{ vars.AIES_INTERNAL_TESTER_GROUP }}
          AIES_TESTFLIGHT_INTERNAL_ENABLED_VALUE: ${{ vars.AIES_TESTFLIGHT_INTERNAL_ENABLED }}
          APP_BUNDLE_ID_VALUE: ${{ vars.APP_BUNDLE_ID }}
          APP_STORE_CONNECT_APP_ID_VALUE: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APPLE_TEAM_ID_VALUE: ${{ vars.APPLE_TEAM_ID }}
          ASC_ISSUER_ID_VALUE: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID_VALUE: ${{ vars.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          archive_uuid="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          swift_version="$(swift --version | sed -n '1p')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          output_directory="${RUNNER_TEMP}/openclaw-aies-testflight"
          mkdir -p "${output_directory}"
          {
            echo "AIES_ARCHIVE_UUID=${archive_uuid}"
            echo "AIES_BUILD_TIMESTAMP=${build_timestamp}"
            echo "AIES_EXPECTED_GIT_BRANCH=${GITHUB_REF_NAME}"
            echo "AIES_EXPECTED_GIT_SHA=${GITHUB_SHA}"
            echo "AIES_INTERNAL_ONLY_CONFIRMED=true"
            echo "AIES_INTERNAL_TESTER_GROUP=${AIES_INTERNAL_TESTER_GROUP_VALUE}"
            echo "AIES_SDK_VERSION=${sdk_version}"
            echo "AIES_SWIFT_VERSION=${swift_version}"
            echo "AIES_TESTFLIGHT_INTERNAL_ENABLED=${AIES_TESTFLIGHT_INTERNAL_ENABLED_VALUE}"
            echo "AIES_TESTFLIGHT_OUTPUT_DIR=${output_directory}"
            echo "AIES_TESTFLIGHT_RESULT_PATH=${output_directory}/OpenClaw-TestFlight-delivery.json"
            echo "AIES_XCODE_VERSION=${xcode_version}"
            echo "ASC_APP_ID=${APP_STORE_CONNECT_APP_ID_VALUE}"
            echo "ASC_APP_IDENTIFIER=${APP_BUNDLE_ID_VALUE}"
            echo "ASC_ISSUER_ID=${ASC_ISSUER_ID_VALUE}"
            echo "ASC_KEY_ID=${ASC_KEY_ID_VALUE}"
            echo "IOS_DEVELOPMENT_TEAM=${APPLE_TEAM_ID_VALUE}"
          } >> "${GITHUB_ENV}"

      - name: Test signing evidence tooling
        run: |
          set -euo pipefail
          cd "${AIES_BUILD_ROOT}/apps/ios/Tools"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            test_aies_package_authority.py \
            test_aies_qualification_workflow_contract.py \
            test_credential_free_keychain_contract.py \
            test_prepare_aies_package_build_root.py \
            test_run_aies_qualification.py \
            test_run_aies_swift_qualification.py \
            test_sanitize_aies_release_log.py \
            test_verify_aies_unsigned_archive.py \
            test_embed_runtime_symbolication_manifest.py \
            test_write_build_manifest.py \
            test_aies_macho_signature_equivalence.py \
            test_aies_release_gate_behavior.py \
            test_verify_aies_internal_signing.py

      - name: Parse Fastlane release configuration without credentials
        run: |
          set -euo pipefail
          fastlane --version | tee "${RUNNER_TEMP}/fastlane-version.txt"
          grep -Eq 'fastlane 2\.228\.0([^0-9]|$)' "${RUNNER_TEMP}/fastlane-version.txt"
          cd "${AIES_BUILD_ROOT}/apps/ios"
          fastlane lanes >/dev/null

      - name: Verify rendered strict Fastlane package contract
        run: |
          set -euo pipefail
          ruby "${AIES_BUILD_ROOT}/apps/ios/Tools/verify_aies_fastlane_package_contract.rb" \
            --project "${AIES_IOS_PROJECT}" \
            --source-packages "${AIES_CLONED_SOURCE_PACKAGES}" \
            --package-cache "${AIES_PACKAGE_CACHE}" \
            --output "${RUNNER_TEMP}/aies-signed-package/evidence/fastlane-package-contract.json"

      - name: Verify rendered AIES export command without credentials
        run: |
          set -euo pipefail
          cd "${AIES_BUILD_ROOT}/apps/ios"
          fastlane ios verify_aies_export_command

      - name: Build OpenClawKit and run reliability tests
        run: |
          set -euo pipefail
          shared_root="${RUNNER_TEMP}/aies-signed-shared-tests"
          git clone --quiet --no-hardlinks --no-checkout "${GITHUB_WORKSPACE}" "${shared_root}"
          git -C "${shared_root}" checkout --quiet --detach "${GITHUB_SHA}"
          shared_package="${shared_root}/apps/shared/OpenClawKit"
          swift package --package-path "${shared_package}" resolve
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/aies_package_authority.py" \
            --repo-root "${AIES_BUILD_ROOT}" \
            validate-scoped-resolved \
            --scope openclawkit \
            --resolved "${shared_package}/Package.resolved" \
            --output "${RUNNER_TEMP}/aies-signed-package/evidence/openclawkit-resolved.json"
          swift build --package-path "${shared_package}" --force-resolved-versions
          swift test --package-path "${shared_package}" --force-resolved-versions --filter OpenClawDiagnosticEventTests
          swift test --package-path "${shared_package}" --force-resolved-versions --filter DeepLinksSecurityTests
          swift test --package-path "${shared_package}" --force-resolved-versions --filter GatewayNodeSessionTests
          swift test --package-path "${shared_package}" --force-resolved-versions --filter ChatViewModelTests
          swift test --package-path "${shared_package}" --force-resolved-versions --filter OpenClawChatOutboxStorageTests
          swift test --package-path "${shared_package}" --force-resolved-versions --filter OpenClawChatOutboxIntegrationTests
          [[ -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v2 --untracked-files=all)" ]]

      - name: Run focused iOS reliability tests
        run: |
          set -euo pipefail
          simulator_udid="$({ xcrun simctl list devices available --json; } | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = []
          for runtime, entries in payload.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              devices.extend(
                  entry for entry in entries
                  if entry.get("isAvailable")
                  and entry.get("udid")
                  and str(entry.get("name", "")).startswith("iPhone")
              )
          if not devices:
              raise SystemExit("No available iOS simulator")
          print(devices[0]["udid"])
          ' )"
          strict_package_args=()
          while IFS= read -r argument; do
            strict_package_args+=("${argument}")
          done < "${AIES_STRICT_PACKAGE_ARGS_FILE}"
          cd "${AIES_BUILD_ROOT}/apps/ios"
          xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_udid}" \
            -parallel-testing-enabled NO \
            -only-testing:OpenClawTests/AIESCrashDiagnosticExporterTests \
            -only-testing:OpenClawTests/AIESAPNsDiagnosticsTests \
            -only-testing:OpenClawTests/AIESDiagnosticRunContinuityTests \
            -only-testing:OpenClawTests/AppCoverageTests \
            -only-testing:OpenClawTests/DeepLinkParserTests \
            -only-testing:OpenClawTests/ExecApprovalNotificationBridgeTests \
            -only-testing:OpenClawTests/GatewayConnectionControllerTests \
            -only-testing:OpenClawTests/GatewayConnectionSecurityTests \
            -only-testing:OpenClawTests/GatewayMobileSetupStateTests \
            -only-testing:OpenClawTests/GatewaySetupDeliveryOwnershipTests \
            -only-testing:OpenClawTests/GatewayOperatorScopeTests \
            -only-testing:OpenClawTests/GatewayOnboardingResetTests \
            -only-testing:OpenClawTests/GatewayStatusBuilderTests \
            -only-testing:OpenClawTests/IOSGatewayChatTransportTests \
            -only-testing:OpenClawTests/LiveActivityManagerTests \
            -only-testing:OpenClawTests/NodeAppModelInvokeTests \
            -only-testing:OpenClawTests/OnboardingStateStoreTests \
            -only-testing:OpenClawTests/OpenClawAppDelegateTests \
            -only-testing:OpenClawTests/QRScannerResultHandoffTests \
            -only-testing:OpenClawTests/SwiftUIRenderSmokeTests \
            -only-testing:OpenClawTests/TalkModeManagerTests \
            -only-testing:OpenClawTests/TalkDurableOutboxTests \
            -only-testing:OpenClawTests/TalkModeIncrementalSpeechBufferTests \
            -only-testing:OpenClawTests/TalkProStateTests \
            -only-testing:OpenClawTests/TalkTTSDiagnosticsTests \
            -only-testing:OpenClawTests/WatchSessionActivationGateTests \
            "${strict_package_args[@]}" \
            test \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) AIES_CREDENTIAL_FREE_TEST_KEYCHAIN' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Materialize ephemeral App Store Connect key
        env:
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_PRIVATE_KEY_P8}" ]]; then
            echo "ASC_PRIVATE_KEY_P8 is not configured in the protected environment." >&2
            exit 1
          fi
          if [[ "${ASC_PRIVATE_KEY_P8}" != *"BEGIN PRIVATE KEY"* ]] || \
             [[ "${ASC_PRIVATE_KEY_P8}" != *"END PRIVATE KEY"* ]]; then
            echo "ASC_PRIVATE_KEY_P8 is not a PEM private key." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/aies-app-store-connect-key.p8"
          umask 077
          printf '%s\n' "${ASC_PRIVATE_KEY_P8}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "ASC_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
          unset ASC_PRIVATE_KEY_P8

      - name: Build, verify, and upload internal TestFlight diagnostic
        run: |
          set -uo pipefail
          cd "${AIES_BUILD_ROOT}/apps/ios"
          set +e
          fastlane ios aies_internal_testflight 2>&1 | \
            tee "${RUNNER_TEMP}/aies-fastlane.raw.log"
          lane_status="${PIPESTATUS[0]}"
          set -e
          printf '{"fastlane_exit_status":%s}\n' "${lane_status}" > \
            "${RUNNER_TEMP}/aies-fastlane-exit-status.json"
          if [[ "${lane_status}" -ne 0 ]]; then
            echo "AIES release lane failed closed with status ${lane_status}." >&2
            exit "${lane_status}"
          fi

      - name: Sanitize retained release log
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          raw_log="${RUNNER_TEMP}/aies-fastlane.raw.log"
          cleanup_raw_log() {
            rm -f -- "${raw_log}"
          }
          trap cleanup_raw_log EXIT
          if [[ -f "${raw_log}" ]]; then
            python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/sanitize_aies_release_log.py" \
              --input "${raw_log}" \
              --output "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-export.log"
          fi
          status_receipt="${RUNNER_TEMP}/aies-fastlane-exit-status.json"
          if [[ -f "${status_receipt}" ]]; then
            mkdir -p "${AIES_TESTFLIGHT_OUTPUT_DIR}"
            cp "${status_receipt}" \
              "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-release-lane-status.json"
          fi

      - name: Verify strict package custody after signed lane
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          python3 "${AIES_BUILD_ROOT}/apps/ios/Tools/prepare_aies_package_build_root.py" verify \
            --receipt "${AIES_PACKAGE_PREPARATION_RECEIPT}" \
            --output "${RUNNER_TEMP}/aies-signed-package/evidence/post-fastlane-verification.json"
          [[ -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v2 --untracked-files=all)" ]]

      - name: Validate retained release evidence
        run: |
          set -euo pipefail
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw.ipa"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw.xcarchive.zip"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-dSYMs.zip"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-build-manifest.json"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-signing-entitlements.json"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-manifest.json"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-signing-entitlements.json"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-release-lane-status.json"
          test -s "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-export.log"
          test -f "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-TestFlight-delivery.json"
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-build-manifest.json" >/dev/null
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-signing-entitlements.json" >/dev/null
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-manifest.json" >/dev/null
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-signing-entitlements.json" >/dev/null
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-release-lane-status.json" >/dev/null
          python3 -m json.tool "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-TestFlight-delivery.json" >/dev/null
          if grep -q "BEGIN PRIVATE KEY" "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-export.log"; then
            echo "Retained export log contains a private-key marker." >&2
            exit 1
          fi
          for sensitive in "${ASC_KEY_PATH}" "${ASC_KEY_ID}" "${ASC_ISSUER_ID}"; do
            if [[ -n "${sensitive}" ]] && grep -Fq -- "${sensitive}" "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-export.log"; then
              echo "Retained export log contains unsanitized ASC metadata." >&2
              exit 1
            fi
          done
          python3 - \
            "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-manifest.json" \
            "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-archive-signing-entitlements.json" \
            "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-build-manifest.json" \
            "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-signing-entitlements.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          paths = [pathlib.Path(path) for path in sys.argv[1:]]
          archive_manifest, archive_signing, export_manifest, export_signing = (
              json.loads(path.read_text(encoding="utf-8")) for path in paths
          )
          expected = (
              (archive_manifest, "artifact_stage", "ARCHIVE_PRE_EXPORT"),
              (archive_manifest, "evidence_stage", "archive"),
              (archive_signing, "status", "archive_integrity_verified"),
              (export_manifest, "artifact_stage", "EXPORTED_IPA_POST_EXPORT"),
              (export_manifest, "evidence_stage", "export"),
              (export_signing, "status", "exported_ipa_distribution_verified"),
          )
          failures = [
              {"key": key, "expected": wanted, "actual": payload.get(key)}
              for payload, key, wanted in expected
              if payload.get(key) != wanted
          ]
          archive_readiness = {
              "status": "NOT_FINAL_PRE_EXPORT",
              "final_distribution_verified": False,
              "upload_eligible": False,
          }
          export_readiness = {
              "status": "VERIFIED_POST_EXPORT",
              "final_distribution_verified": True,
              "upload_eligible": True,
          }
          if archive_manifest.get("distribution_readiness") != archive_readiness:
              failures.append({"archive_distribution_readiness": archive_manifest.get("distribution_readiness")})
          if export_manifest.get("distribution_readiness") != export_readiness:
              failures.append({"export_distribution_readiness": export_manifest.get("distribution_readiness")})

          archive_expectation = archive_manifest.get("embedded_distribution_expectations")
          export_expectation = export_manifest.get("embedded_distribution_expectations")
          expected_expectation = {
              "main_app_aps_environment": "production",
              "enforcement_stage": "EXPORTED_IPA_POST_EXPORT",
          }
          if archive_expectation != expected_expectation or export_expectation != expected_expectation:
              failures.append({
                  "embedded_distribution_expectations": {
                      "archive": archive_expectation,
                      "export": export_expectation,
                  }
              })
          archive_observation = archive_manifest.get("observed_archive_signing")
          export_observation = export_manifest.get("observed_archive_signing")
          archive_main = next(
              (
                  item
                  for item in archive_signing.get("archive", {}).get("bundles", [])
                  if item.get("bundle_id") == "ai.openclaw.client.J76B47MZ6V"
              ),
              None,
          )
          export_archive_main = next(
              (
                  item
                  for item in export_signing.get("archive", {}).get("bundles", [])
                  if item.get("bundle_id") == "ai.openclaw.client.J76B47MZ6V"
              ),
              None,
          )
          if (
              not isinstance(archive_observation, dict)
              or archive_observation != export_observation
              or not isinstance(archive_main, dict)
              or not isinstance(export_archive_main, dict)
              or archive_observation.get("main_app_aps_environment")
              != archive_main.get("aps_environment")
              or archive_observation.get("main_app_aps_environment")
              != export_archive_main.get("aps_environment")
              or archive_observation.get("main_app_get_task_allow")
              != archive_main.get("get_task_allow")
              or archive_observation.get("main_app_get_task_allow")
              != export_archive_main.get("get_task_allow")
              or archive_observation.get("main_app_team_identifier")
              != archive_main.get("team_identifier")
              or archive_observation.get("main_app_team_identifier")
              != export_archive_main.get("team_identifier")
              or archive_observation.get("main_app_profile_type")
              != archive_main.get("profile", {}).get("profile_type")
              or archive_observation.get("main_app_profile_type")
              != export_archive_main.get("profile", {}).get("profile_type")
              or archive_observation.get(
                  "distribution_expectation_enforced_against_archive"
              ) is not False
          ):
              failures.append({
                  "observed_archive_signing": {
                      "archive": archive_observation,
                      "export": export_observation,
                  }
              })

          archive_integrity = archive_manifest.get("archive_integrity_verification")
          export_archive_integrity = export_manifest.get(
              "archive_integrity_verification"
          )
          archive_receipt_sha256 = hashlib.sha256(paths[1].read_bytes()).hexdigest()
          if (
              not isinstance(archive_integrity, dict)
              or archive_integrity.get("status") != "archive_integrity_verified"
              or archive_integrity.get("receipt_sha256") != archive_receipt_sha256
              or archive_integrity.get(
                  "verifier_replayed_against_current_artifacts"
              ) is not True
              or archive_integrity.get("expected_main_bundle_id")
              != "ai.openclaw.client.J76B47MZ6V"
              or archive_integrity.get("expected_team_id") != "J76B47MZ6V"
              or not isinstance(export_archive_integrity, dict)
              or export_archive_integrity.get("status")
              != "verified_within_stage_b_replay"
              or export_archive_integrity.get(
                  "verifier_replayed_against_current_artifacts"
              ) is not True
              or export_archive_integrity.get("expected_main_bundle_id")
              != "ai.openclaw.client.J76B47MZ6V"
              or export_archive_integrity.get("expected_team_id") != "J76B47MZ6V"
          ):
              failures.append({
                  "archive_integrity_verification": {
                      "archive": archive_integrity,
                      "export": export_archive_integrity,
                  }
              })

          archive_verification = archive_manifest.get("final_distribution_verification")
          if (
              not isinstance(archive_verification, dict)
              or archive_verification.get("status") != "pending_exported_ipa_stage_b"
              or archive_verification.get("receipt_sha256") is not None
              or archive_verification.get("ipa_sha256") is not None
          ):
              failures.append({"archive_final_distribution_verification": archive_verification})
          export_verification = export_manifest.get("final_distribution_verification")
          receipt_sha256 = hashlib.sha256(paths[3].read_bytes()).hexdigest()
          ipa_path = paths[2].parent / "OpenClaw.ipa"
          ipa_sha256 = hashlib.sha256(ipa_path.read_bytes()).hexdigest()
          if (
              not isinstance(export_verification, dict)
              or export_verification.get("status")
              != "exported_ipa_distribution_verified"
              or export_verification.get("receipt_file_name") != paths[3].name
              or export_verification.get("receipt_sha256") != receipt_sha256
              or export_verification.get(
                  "verifier_replayed_against_current_artifacts"
              ) is not True
              or export_verification.get("ipa_sha256") != ipa_sha256
          ):
              failures.append({"export_final_distribution_verification": export_verification})
          ipa_artifacts = [
              item
              for item in export_manifest.get("artifacts", [])
              if isinstance(item, dict) and item.get("kind") == "ipa"
          ]
          if len(ipa_artifacts) != 1 or ipa_artifacts[0].get("sha256") != ipa_sha256:
              failures.append({"export_ipa_artifacts": ipa_artifacts})

          identity_keys = (
              "git_sha",
              "git_branch",
              "version",
              "build_number",
              "archive_uuid",
              "main_bundle_id",
              "extension_bundle_ids",
              "watch_bundle_ids_if_present",
          )
          identity_mismatches = {
              key: {
                  "archive": archive_manifest.get(key),
                  "export": export_manifest.get(key),
              }
              for key in identity_keys
              if archive_manifest.get(key) != export_manifest.get(key)
          }
          if identity_mismatches:
              failures.append({"archive_export_identity_mismatches": identity_mismatches})
          if failures:
              raise SystemExit(
                  "retained archive/export evidence failed stage validation: "
                  + json.dumps(failures, sort_keys=True)
              )
          PY
          python3 - "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-release-lane-status.json" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt != {"fastlane_exit_status": 0}:
              raise SystemExit("release lane did not finish with exact zero status")
          PY
          python3 - "${AIES_TESTFLIGHT_OUTPUT_DIR}/OpenClaw-TestFlight-delivery.json" "${GITHUB_SHA}" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "asc_build_audience_type": "INTERNAL_ONLY",
              "asc_processing_state": "VALID",
              "beta_review_requested": False,
              "distribution": "internal_only",
              "external_distribution_requested": False,
              "git_sha": sys.argv[2],
              "status": "uploaded_processing_complete",
              "testflight_internal_testing_only": True,
          }
          mismatches = {
              key: {"expected": value, "actual": report.get(key)}
              for key, value in expected.items()
              if report.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  "retained TestFlight delivery evidence failed exact validation: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          PY

      - name: Upload signed IPA
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-AIES-signed-IPA-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Upload signed xcarchive
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-AIES-signed-xcarchive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw.xcarchive.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload signed dSYMs
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-AIES-signed-dSYMs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-dSYMs.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload signed release evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-AIES-TestFlight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-build-manifest.json
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-signing-entitlements.json
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-archive-manifest.json
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-archive-signing-entitlements.json
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-export.log
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-release-lane-status.json
            ${{ runner.temp }}/openclaw-aies-testflight/OpenClaw-TestFlight-delivery.json
          retention-days: 90
          if-no-files-found: warn

      - name: Seal signed package-authority evidence
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/aies-signed-package/evidence"
          test -d "${evidence}"
          python3 - "${evidence}" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          sums = root / "SHA256SUMS"
          if sums.exists() or sums.is_symlink():
              raise SystemExit("signed package evidence is already sealed")
          records = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"signed package evidence contains a symlink: {path}")
              if path.is_file():
                  records.append(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  "
                      f"{path.relative_to(root).as_posix()}"
                  )
          if not records:
              raise SystemExit("signed package evidence is empty")
          sums.write_text("\n".join(records) + "\n", encoding="utf-8")
          PY
          cat "${evidence}/SHA256SUMS"

      - name: Upload signed package-authority evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenClaw-AIES-package-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aies-signed-package/evidence
          retention-days: 90
          if-no-files-found: warn

      # Keep key deletion last: any archive/symbol evidence that exists is retained
      # before cleanup can fail, including the post-upload validation failure path.
      - name: Remove ephemeral App Store Connect key
        if: always()
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/aies-app-store-connect-key.p8"
          case "${key_path}" in
            "${RUNNER_TEMP}"/*) rm -f -- "${key_path}" ;;
            *) echo "Refusing to remove unexpected key path." >&2; exit 1 ;;
          esac
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            fastlane_key_path="${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            case "${fastlane_key_path}" in
              "${HOME}/.appstoreconnect/private_keys/"*) rm -f -- "${fastlane_key_path}" ;;
              *) echo "Refusing to remove unexpected Fastlane key path." >&2; exit 1 ;;
            esac
          fi
